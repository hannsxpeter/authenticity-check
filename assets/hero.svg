<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">authenticity-check</title>
  <desc id="d">Arcade title screen. AUTHENTICITY CHECK wordmark, tagline Human or machine? Get an honest read., and npx @hxp-tools/authenticity-check. A magnifying glass scans a submission with flagged and human spans while a meter reads 72 out of 100, Mixed signals.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .display{font-family:Newsreader,Georgia,"Times New Roman",serif}
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1C2433" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="0" y="30" width="330" height="270"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="#0E1218"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="none" stroke="#2A3548"/>

  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#151B24"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2A3548"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#5CC8FF" letter-spacing="1.5">1UP</text>
  <text x="78" y="28" class="mono" font-size="13" font-weight="700" fill="#E8E2D6" letter-spacing="1.5">READER</text>
  <text x="600" y="28" class="mono" font-size="13" font-weight="700" fill="#3DDC97" text-anchor="middle" letter-spacing="1.5">HI-SCORE: NONE. IT IS A READ, NOT A TARGET</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#7F8BA3" text-anchor="end" letter-spacing="1.5">CREDIT 01</text>

  <text x="56" y="104" class="mono" font-size="14" font-weight="700" fill="#5CC8FF" letter-spacing="3">DIAGNOSTIC SKILL / READ-ONLY</text>
  <text x="56" y="170" class="display" font-size="60" font-weight="600" fill="#F4EFE4">AUTHENTICITY</text>
  <text x="56" y="228" class="display" font-size="60" font-weight="600" fill="#E8B84A">CHECK</text>
  <text x="56" y="270" class="sans" font-size="22" font-weight="600" fill="#E8E2D6">Human or machine? Get an honest read.</text>
  <text x="56" y="298" class="sans" font-size="18" fill="#A8B0C0">Scores and flags. Never rewrites.</text>

  <text x="56" y="332" class="mono" font-size="12" font-weight="700" fill="#5CC8FF" letter-spacing="2">PRESS START</text>
  <rect x="56" y="342" width="420" height="40" fill="#10261E" stroke="#3DDC97" stroke-width="2"/>
  <text x="72" y="368" class="mono" font-size="17" font-weight="700" fill="#3DDC97">&gt; npx @hxp-tools/authenticity-check</text>
  <rect x="452" y="354" width="10" height="18" fill="#3DDC97">
    <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="406" class="mono" font-size="12" fill="#7F8BA3" letter-spacing="1.5">NO SCRIPTS / NO NETWORK / READ-ONLY TOOLS / 13 CODING AGENTS</text>

  <!-- The submission under the lens -->
  <g transform="translate(630 78)">
    <rect width="330" height="300" rx="4" fill="#EDE6D6"/>
    <path d="M0 4a4 4 0 0 1 4-4h322a4 4 0 0 1 4 4v26H0Z" fill="#D9CFBA"/>
    <text x="14" y="20" class="mono" font-size="12" font-weight="700" fill="#0E1218">SUBMISSION.TXT</text>
    <text x="316" y="20" class="mono" font-size="11" fill="#6B5E48" text-anchor="end">READ-ONLY</text>

    <rect x="18" y="48" width="290" height="8" fill="#9C917E"/>
    <rect x="10" y="64" width="232" height="38" fill="#FF5C6C" fill-opacity="0.28" stroke="#FF5C6C"/>
    <rect x="18" y="70" width="216" height="8" fill="#8A5A58"/>
    <rect x="18" y="88" width="200" height="8" fill="#8A5A58"/>
    <rect x="250" y="75" width="62" height="16" fill="#FF5C6C"/>
    <text x="281" y="87" class="mono" font-size="10" font-weight="700" fill="#0E1218" text-anchor="middle">TELL</text>
    <rect x="18" y="114" width="282" height="8" fill="#9C917E"/>
    <rect x="18" y="136" width="270" height="8" fill="#9C917E"/>
    <rect x="10" y="152" width="218" height="20" fill="#FF5C6C" fill-opacity="0.28" stroke="#FF5C6C"/>
    <rect x="18" y="158" width="202" height="8" fill="#8A5A58"/>
    <rect x="250" y="154" width="62" height="16" fill="#FF5C6C"/>
    <text x="281" y="166" class="mono" font-size="10" font-weight="700" fill="#0E1218" text-anchor="middle">TELL</text>
    <rect x="18" y="180" width="140" height="8" fill="#9C917E"/>
    <rect x="18" y="202" width="210" height="8" fill="#9C917E"/>
    <rect x="18" y="224" width="286" height="8" fill="#9C917E"/>
    <rect x="10" y="240" width="226" height="20" fill="#3DDC97" fill-opacity="0.28" stroke="#2FA673"/>
    <rect x="18" y="246" width="210" height="8" fill="#4E7A62"/>
    <rect x="250" y="242" width="62" height="16" fill="#3DDC97"/>
    <text x="281" y="254" class="mono" font-size="10" font-weight="700" fill="#0E1218" text-anchor="middle">HUMAN</text>
    <rect x="18" y="268" width="176" height="8" fill="#9C917E"/>

    <g clip-path="url(#card)">
      <rect x="0" y="30" width="330" height="3" fill="#5CC8FF" fill-opacity="0.85">
        <animate attributeName="y" values="30;296;30" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Magnifying glass -->
    <g transform="translate(130 50)">
      <rect x="96" y="96" width="22" height="78" fill="#2A3548" transform="rotate(-45 107 135)"/>
      <rect x="99" y="100" width="16" height="70" fill="#7F8BA3" transform="rotate(-45 107 135)"/>
      <circle cx="60" cy="60" r="50" fill="#F4EFE4" fill-opacity="0.94"/>
      <text x="60" y="58" class="mono" font-size="22" font-weight="700" fill="#C23A4A" text-anchor="middle">delve</text>
      <rect x="22" y="66" width="76" height="4" fill="#FF5C6C"/>
      <text x="60" y="88" class="mono" font-size="10" font-weight="700" fill="#6B5E48" text-anchor="middle">PATTERN 16</text>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#5CC8FF" stroke-width="10"/>
      <circle cx="60" cy="60" r="56" fill="none" stroke="#0E1218" stroke-width="2"/>
    </g>
  </g>

  <!-- Authenticity meter -->
  <g transform="translate(990 78)">
    <rect width="180" height="300" rx="4" fill="#151B24" stroke="#2A3548"/>
    <text x="90" y="30" class="mono" font-size="12" font-weight="700" fill="#5CC8FF" text-anchor="middle" letter-spacing="2">AUTHENTICITY</text>
    <text x="90" y="100" class="display" font-size="64" font-weight="600" fill="#F4EFE4" text-anchor="middle">72</text>
    <text x="90" y="122" class="mono" font-size="13" fill="#7F8BA3" text-anchor="middle">/ 100</text>
    <text x="90" y="148" class="mono" font-size="12" font-weight="700" fill="#E8B84A" text-anchor="middle" letter-spacing="1.5">MIXED SIGNALS</text>

    <rect x="15" y="162" width="13" height="16" fill="#FF5C6C"/>
    <rect x="30" y="162" width="13" height="16" fill="#FF5C6C"/>
    <rect x="45" y="162" width="13" height="16" fill="#FF5C6C"/>
    <rect x="60" y="162" width="13" height="16" fill="#FF5C6C"/>
    <rect x="75" y="162" width="13" height="16" fill="#FF5C6C"/>
    <rect x="90" y="162" width="13" height="16" fill="#FF5C6C"/>
    <rect x="105" y="162" width="13" height="16" fill="#E8B84A"/>
    <rect x="120" y="162" width="13" height="16" fill="#E8B84A" fill-opacity="0.2"/>
    <rect x="135" y="162" width="13" height="16" fill="#3DDC97" fill-opacity="0.2"/>
    <rect x="150" y="162" width="13" height="16" fill="#3DDC97" fill-opacity="0.2"/>

    <text x="16" y="214" class="mono" font-size="12" fill="#A8B0C0">FLAGS</text>
    <text x="164" y="214" class="mono" font-size="12" font-weight="700" fill="#FF5C6C" text-anchor="end">2</text>
    <text x="16" y="240" class="mono" font-size="12" fill="#A8B0C0">HUMAN MARKERS</text>
    <text x="164" y="240" class="mono" font-size="12" font-weight="700" fill="#3DDC97" text-anchor="end">1</text>
    <text x="16" y="266" class="mono" font-size="12" fill="#A8B0C0">CARRIERS</text>
    <text x="164" y="266" class="mono" font-size="12" font-weight="700" fill="#5CC8FF" text-anchor="end">0</text>
    <text x="90" y="290" class="mono" font-size="10" fill="#7F8BA3" text-anchor="middle" letter-spacing="1">A READ, NOT PROOF</text>
  </g>
</svg>
