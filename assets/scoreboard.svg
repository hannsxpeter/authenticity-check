<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="t d">
  <title id="t">Scoreboard</title>
  <desc id="d">The 0-100 authenticity scale. Reads AI-generated from 0 to 59, Mixed signals from 60 to 84, Reads human from 85 to 100. Pins mark the worked examples: 18, 30, 64, 93, and 95.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1C2433" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="250" fill="#0E1218"/>
  <rect width="1200" height="250" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="10" fill="none" stroke="#2A3548"/>

  <text x="40" y="44" class="mono" font-size="14" font-weight="700" fill="#5CC8FF" letter-spacing="3">SCOREBOARD</text>
  <text x="1160" y="44" class="mono" font-size="12" font-weight="700" fill="#FF5C6C" text-anchor="end" letter-spacing="1.5">NO HIGH-SCORE TABLE</text>

  <g class="mono" font-size="11" font-weight="700" text-anchor="middle">
    <path d="M236 92h12l-6 8Z" fill="#FF5C6C"/>
    <text x="242" y="86" fill="#FF5C6C">EX1 18</text>
    <path d="M370 92h12l-6 8Z" fill="#FF5C6C"/>
    <text x="376" y="86" fill="#FF5C6C">EX5 30</text>
    <path d="M751 92h12l-6 8Z" fill="#E8B84A"/>
    <text x="757" y="86" fill="#E8B84A">EX2 64</text>
    <path d="M1076 92h12l-6 8Z" fill="#3DDC97"/>
    <text x="1060" y="70" fill="#3DDC97">EX6 93</text>
    <path d="M1098 92h12l-6 8Z" fill="#3DDC97"/>
    <text x="1118" y="86" fill="#3DDC97">EX3 95</text>
  </g>

  <rect x="40" y="102" width="672" height="56" fill="#2A1518" stroke="#FF5C6C" stroke-width="2"/>
  <text x="376" y="126" class="mono" font-size="14" font-weight="700" fill="#FF5C6C" text-anchor="middle" letter-spacing="1.5">READS AI-GENERATED</text>
  <text x="376" y="146" class="mono" font-size="12" fill="#C9868E" text-anchor="middle">0-59</text>

  <rect x="712" y="102" width="280" height="56" fill="#2A2412" stroke="#E8B84A" stroke-width="2"/>
  <text x="852" y="126" class="mono" font-size="14" font-weight="700" fill="#E8B84A" text-anchor="middle" letter-spacing="1.5">MIXED SIGNALS</text>
  <text x="852" y="146" class="mono" font-size="12" fill="#C9AE6E" text-anchor="middle">60-84</text>

  <rect x="992" y="102" width="168" height="56" fill="#10261E" stroke="#3DDC97" stroke-width="2"/>
  <text x="1076" y="126" class="mono" font-size="14" font-weight="700" fill="#3DDC97" text-anchor="middle" letter-spacing="1.5">READS HUMAN</text>
  <text x="1076" y="146" class="mono" font-size="12" fill="#86C9A8" text-anchor="middle">85-100</text>

  <g class="mono" font-size="11" fill="#7F8BA3" text-anchor="middle">
    <text x="40" y="178">0</text>
    <text x="712" y="178">60</text>
    <text x="992" y="178">85</text>
    <text x="1160" y="178">100</text>
  </g>

  <text x="40" y="216" class="sans" font-size="15" fill="#E8E2D6">The score is a read, not a target. A low score is not an accusation, and no number is ever carried into a rewrite.</text>
</svg>
